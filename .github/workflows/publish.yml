name: Publicera inlägg

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALL_SECRETS: ${{ toJSON(secrets) }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Publicera det som är dags
        id: pub
        run: python -m bot.publish_due
        continue-on-error: true

      - name: Spara status
        run: |
          git config user.name "influencer-bot"
          git config user.email "influencer-bot@users.noreply.github.com"
          git add queue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publiceringsstatus uppdaterad"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

      - name: Markera fel
        if: steps.pub.outcome == 'failure'
        run: |
          echo "::error::Minst ett inlägg kunde inte publiceras – se loggen ovan."
          exit 1
