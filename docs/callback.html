<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggningskod</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; color: #222; }
  code { display: block; word-break: break-all; background: #f3f1ed; padding: 14px; border-radius: 8px; margin: 12px 0; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #222; color: #fff; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<h1>Kopiera koden</h1>
<p id="info">Klistra in koden i arbetsflödet <b>Koppla TikTok-konto</b> på GitHub (Actions → Koppla TikTok-konto → Run workflow).</p>
<code id="code">Ingen kod hittades i adressen.</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Kopiera</button>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get("code")) document.getElementById("code").textContent = p.get("code");
  if (p.get("error")) document.getElementById("info").textContent = "Fel från TikTok: " + p.get("error") + " " + (p.get("error_description") || "");
</script>
</body>
</html>
